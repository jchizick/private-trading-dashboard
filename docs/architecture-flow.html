<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Market Command — Architecture & Operator Flows</title>
  <style>
    :root {
      --bg: #070b0c;
      --bg-rail: #050708;
      --surface: #0d1415;
      --surface-elevated: #111b1b;
      --surface-muted: #0a1011;
      --border: #1d2a2a;
      --border-strong: #2a3f3b;
      --text: #e3eee9;
      --text-muted: #8fa09a;
      --text-faint: #63736e;
      --accent: #40c48d;
      --accent-strong: #74e0ae;
      --accent-soft: rgba(64, 196, 141, 0.12);
      --accent-line: rgba(116, 224, 174, 0.7);
      --negative: #e06c75;
      --warning: #d6a75a;
      --warning-soft: rgba(214, 167, 90, 0.12);
      --future: #8ea4ff;
      --future-soft: rgba(142, 164, 255, 0.12);
      --manual: #d6a75a;
      --cache: #8fa09a;
      --radius: 6px;
      --font-sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
      color: var(--text);
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(90deg, rgba(64, 196, 141, 0.04) 1px, transparent 1px),
        linear-gradient(rgba(64, 196, 141, 0.03) 1px, transparent 1px),
        radial-gradient(circle at 15% 0%, rgba(64, 196, 141, 0.08), transparent 28rem),
        var(--bg);
      background-size: 36px 36px, 36px 36px, auto, auto;
      font-family: var(--font-sans);
    }

    button {
      font: inherit;
    }

    .page {
      width: min(1920px, 100%);
      margin: 0 auto;
      padding: 20px 22px 26px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 22px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(42, 63, 59, 0.62);
    }

    .identity {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .brand {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      background: var(--accent-soft);
      color: var(--accent-strong);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-family: var(--font-mono);
      max-width: 980px;
      font-size: clamp(1.45rem, 2.05vw, 2.32rem);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .subtitle {
      display: block;
      margin-top: 7px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .telemetry {
      display: grid;
      grid-template-columns: repeat(4, minmax(92px, 1fr));
      gap: 1px;
      min-width: min(620px, 48vw);
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--border);
    }

    .telemetry div {
      display: grid;
      gap: 5px;
      padding: 10px 12px;
      background: rgba(10, 16, 17, 0.96);
    }

    .telemetry span,
    .eyebrow,
    .lane__meta,
    .node__kind,
    .detailLabel {
      color: var(--text-faint);
      font-family: var(--font-mono);
      font-size: 0.66rem;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .telemetry strong {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      color: var(--text);
      white-space: nowrap;
    }

    .overview {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 372px;
      gap: 16px;
      margin-top: 16px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: rgba(10, 16, 17, 0.9);
      box-shadow: 0 18px 54px rgba(0, 0, 0, 0.3);
    }

    .mapPanel {
      position: relative;
      overflow: auto;
      min-height: 820px;
    }

    .flowTabs {
      position: sticky;
      top: 0;
      z-index: 12;
      display: flex;
      gap: 7px;
      padding: 10px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
      background: rgba(7, 11, 12, 0.96);
      backdrop-filter: blur(10px);
    }

    .flowButton {
      flex: 0 0 auto;
      min-height: 32px;
      padding: 7px 11px;
      border: 1px solid rgba(42, 63, 59, 0.82);
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.032);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.68rem;
      text-transform: uppercase;
      cursor: pointer;
    }

    .flowButton:hover,
    .flowButton:focus-visible,
    .flowButton.is-active {
      color: var(--accent-strong);
      border-color: rgba(116, 224, 174, 0.74);
      background: rgba(64, 196, 141, 0.14);
      box-shadow: inset 0 -2px 0 rgba(116, 224, 174, 0.32);
      outline: none;
    }

    .mapCanvas {
      position: relative;
      min-width: 1420px;
      padding: 14px;
    }

    .lanes {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(6, minmax(190px, 1fr));
      gap: 10px;
      align-items: start;
    }

    .lane {
      min-height: 700px;
      border: 1px solid rgba(42, 63, 59, 0.72);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(17, 27, 27, 0.74), rgba(8, 16, 16, 0.46));
    }

    .lane__header {
      position: sticky;
      top: 55px;
      z-index: 4;
      padding: 10px 11px;
      border-bottom: 1px solid rgba(42, 63, 59, 0.55);
      background: rgba(8, 13, 15, 0.92);
      backdrop-filter: blur(8px);
    }

    .lane__title {
      display: block;
      margin-bottom: 5px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 700;
    }

    .lane__body {
      display: grid;
      gap: 9px;
      padding: 10px;
    }

    .node {
      position: relative;
      display: grid;
      gap: 7px;
      min-height: 106px;
      padding: 10px;
      border: 1px solid rgba(56, 76, 73, 0.86);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(13, 20, 21, 0.98), rgba(7, 11, 12, 0.96));
      color: inherit;
      text-align: left;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.025), 0 10px 24px rgba(0, 0, 0, 0.16);
    }

    .node:focus-visible,
    .node:hover,
    .node.is-selected {
      border-color: rgba(116, 224, 174, 0.72);
      outline: none;
    }

    .node.is-selected {
      background: linear-gradient(180deg, rgba(17, 33, 30, 0.98), rgba(8, 15, 15, 0.98));
      box-shadow: inset 0 0 0 1px rgba(116, 224, 174, 0.34), 0 0 0 1px rgba(116, 224, 174, 0.22), 0 16px 34px rgba(0, 0, 0, 0.28);
    }

    .node.is-dim {
      opacity: 0.22;
    }

    .node.is-in-flow:not(.is-selected) {
      border-color: rgba(84, 131, 114, 0.98);
      box-shadow: inset 2px 0 0 rgba(64, 196, 141, 0.44), inset 0 1px 0 rgba(255, 255, 255, 0.03), 0 12px 26px rgba(0, 0, 0, 0.2);
    }

    .node__top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .node__title {
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.76rem;
      font-weight: 700;
      line-height: 1.25;
    }

    .node__status {
      flex: 0 0 auto;
      padding: 3px 5px;
      border: 1px solid rgba(143, 160, 154, 0.3);
      border-radius: 4px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.58rem;
      line-height: 1;
      text-transform: uppercase;
    }

    .node[data-status="implemented"] .node__status {
      color: var(--accent-strong);
      border-color: rgba(64, 196, 141, 0.36);
      background: rgba(64, 196, 141, 0.08);
    }

    .node[data-status="manual"] .node__status {
      color: var(--manual);
      border-color: rgba(214, 167, 90, 0.36);
      background: rgba(214, 167, 90, 0.08);
    }

    .node[data-status="future"] .node__status {
      color: var(--future);
      border-color: rgba(142, 164, 255, 0.38);
      background: var(--future-soft);
    }

    .node[data-status="cache"] .node__status {
      color: var(--cache);
      border-color: rgba(143, 160, 154, 0.28);
      background: rgba(143, 160, 154, 0.08);
    }

    .node__desc {
      margin: 0;
      color: var(--text-muted);
      color: rgba(177, 188, 184, 0.9);
      font-size: 0.7rem;
      line-height: 1.42;
    }

    .node__files {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .chip {
      display: inline-flex;
      max-width: 100%;
      padding: 3px 6px;
      border: 1px solid rgba(42, 63, 59, 0.7);
      border-radius: 4px;
      color: rgba(143, 160, 154, 0.78);
      font-family: var(--font-mono);
      font-size: 0.59rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .edgeLayer {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .edgePath {
      fill: none;
      stroke: rgba(116, 224, 174, 0.3);
      stroke-width: 1.25;
    }

    .edgePath.is-highlight {
      stroke: rgba(116, 224, 174, 0.92);
      stroke-width: 2.2;
    }

    .edgePath.is-dim {
      stroke: rgba(99, 115, 110, 0.12);
    }

    .edgeLabel {
      fill: rgba(177, 188, 184, 0.74);
      font-family: var(--font-mono);
      font-size: 10px;
    }

    .edgeLabel.is-dim {
      opacity: 0.15;
    }

    .detailPanel {
      position: sticky;
      top: 18px;
      display: grid;
      gap: 14px;
      padding: 15px;
      max-height: calc(100vh - 36px);
      overflow: auto;
    }

    .detailPanel h2 {
      margin: 0;
      font-family: var(--font-mono);
      font-size: 1.02rem;
    }

    .detailPanel p {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.86rem;
      line-height: 1.55;
    }

    .detailBlock {
      display: grid;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid rgba(42, 63, 59, 0.55);
    }

    .detailList {
      display: grid;
      gap: 6px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .detailList li {
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.68rem;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .legend {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .legendItem {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.66rem;
      text-transform: uppercase;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    .dot.manual { background: var(--manual); }
    .dot.cache { background: var(--cache); }
    .dot.future { background: var(--future); }

    .storageGrid {
      display: grid;
      gap: 6px;
    }

    .storageRow {
      padding: 8px;
      border: 1px solid rgba(42, 63, 59, 0.5);
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.02);
    }

    .storageRow strong {
      display: block;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.68rem;
      overflow-wrap: anywhere;
    }

    .storageRow span {
      display: block;
      margin-top: 4px;
      color: var(--text-faint);
      font-size: 0.72rem;
      line-height: 1.35;
    }

    .loadNote {
      display: none;
      margin-top: 8px;
      color: rgba(214, 167, 90, 0.54);
      font-size: 0.68rem;
      line-height: 1.45;
    }

    .loadNote.is-visible {
      display: none;
    }

    @media (max-width: 1560px) {
      .overview {
        grid-template-columns: 1fr;
      }

      .mapCanvas {
        min-width: 0;
      }

      .lanes {
        grid-template-columns: repeat(6, minmax(0, 1fr));
      }

      .detailPanel {
        position: static;
        max-height: none;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        align-items: start;
      }

      .detailPanel > div:first-child,
      .detailPanel > p {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 1180px) {
      .topbar {
        display: grid;
      }

      .telemetry {
        min-width: 0;
        width: 100%;
      }

      .overview {
        grid-template-columns: 1fr;
      }

      .detailPanel {
        position: static;
        max-height: none;
      }
    }

    @media (max-width: 760px) {
      .page {
        padding: 16px 12px;
      }

      .telemetry {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .mapPanel {
        min-height: 700px;
      }

      .mapCanvas {
        min-width: 1160px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="identity">
        <span class="brand">[JC]</span>
        <div>
          <h1 id="projectTitle">Market Command — Architecture &amp; Operator Flows</h1>
          <span id="projectDescription" class="subtitle">System map for the private trading dashboard.</span>
          <span id="loadNote" class="loadNote">Using embedded fallback data. To load the full JSON graph, serve the docs directory over HTTP so architecture-flow.json can be fetched.</span>
        </div>
      </div>
      <section class="telemetry" aria-label="Architecture counts">
        <div><span>Nodes</span><strong id="nodeCount">--</strong></div>
        <div><span>Edges</span><strong id="edgeCount">--</strong></div>
        <div><span>Flows</span><strong id="flowCount">--</strong></div>
        <div><span>Status</span><strong id="statusCount">local MVP</strong></div>
      </section>
    </header>

    <section class="overview">
      <section class="panel mapPanel" aria-label="Architecture flow map">
        <nav id="flowTabs" class="flowTabs" aria-label="Flow selector"></nav>
        <div id="mapCanvas" class="mapCanvas">
          <svg id="edgeLayer" class="edgeLayer" aria-hidden="true"></svg>
          <div id="lanes" class="lanes"></div>
        </div>
      </section>

      <aside id="detailPanel" class="panel detailPanel" aria-label="Selected detail"></aside>
    </section>
  </main>

  <script>
    const embeddedData = {
      project: "Market Command Trading Dashboard",
      description: "Embedded fallback graph for direct file viewing. The full machine-readable graph lives in architecture-flow.json.",

        { id: "normalization", title: "Normalization And Domain Logic", lane: 3, description: "Typed parsing and calculations." },
        { id: "state", title: "Client State And Persistence", lane: 4, description: "Daily snapshots, localStorage, caches." },

      ],

        { id: "fmp-source", title: "Financial Modeling Prep", group: "external", kind: "provider", status: "implemented", description: "Quote provider used server-side by /api/market-quotes.", files: ["src/app/api/market-quotes/route.ts"] },
        { id: "twelve-source", title: "Twelve Data", group: "external", kind: "provider", status: "implemented", description: "Quote provider for gold, CAD, and BTC fallback.", files: ["src/app/api/market-quotes/route.ts"] },
        { id: "yahoo-source", title: "Yahoo Finance", group: "external", kind: "provider", status: "implemented", description: "SPX500 index/futures candle provider.", files: ["src/app/api/market-candles/route.ts"] },
        { id: "cmc-source", title: "CoinMarketCap", group: "external", kind: "provider", status: "implemented", description: "Fear & Greed provider through server route.", files: ["src/app/api/fear-greed/route.ts"] },
        { id: "csv-files", title: "Local CSV Files", group: "external", kind: "file-input", status: "manual", description: "Account equity and exchange trade ledger imports.", files: ["src/components/dashboard/PerformanceModule.tsx"] },
        { id: "external-tools", title: "External Trading Tools", group: "external", kind: "manual-source", status: "manual", description: "MMT, TradingView, Coinalyze, Deribit, orderflow, CVD, OI, heatmaps.", files: ["src/components/dashboard/MarketSituationModule.tsx"] },
        { id: "api-market-quotes", title: "GET /api/market-quotes", group: "api", kind: "api-route", status: "implemented", description: "Server-side FMP/Twelve proxy with process cache and controlled fallback.", files: ["src/app/api/market-quotes/route.ts"] },
        { id: "api-market-candles", title: "GET /api/market-candles", group: "api", kind: "api-route", status: "implemented", description: "Server-side Yahoo candle proxy for index/futures source toggle.", files: ["src/app/api/market-candles/route.ts"] },

        { id: "auth-proxy", title: "Auth Proxy Gate", group: "api", kind: "middleware", status: "implemented", description: "Redirects anonymous users to /login.", files: ["src/proxy.ts"] },
        { id: "quote-normalizers", title: "Quote Normalizers", group: "normalization", kind: "normalization", status: "implemented", description: "FMP/Twelve payload normalization.", files: ["src/lib/fmpQuoteNormalization.ts", "src/lib/twelveQuoteNormalization.ts"] },
        { id: "candle-normalizer", title: "Yahoo Candle Normalizer", group: "normalization", kind: "normalization", status: "implemented", description: "Yahoo chart payload normalization.", files: ["src/lib/yahooCandleNormalization.ts"] },
        { id: "import-parsers", title: "CSV Import Parsers", group: "normalization", kind: "parser", status: "implemented", description: "Account equity and exchange trade ledger CSV validation.", files: ["src/lib/accountEquityCsvImport.ts", "src/lib/exchangeTradeLedgerCsvImport.ts"] },

        { id: "market-module", title: "Market Overview", group: "modules", kind: "dashboard-module", status: "implemented", description: "SPX/watchlist quote read and external tool strip.", files: ["src/components/dashboard/MarketSituationModule.tsx"] },
        { id: "candles-chart", title: "SPX Candle Chart", group: "modules", kind: "chart", status: "implemented", description: "Index/Futures candle chart.", files: ["src/components/dashboard/MarketOverviewCandlesChart.tsx"] },
        { id: "gamma-module", title: "Gamma Context", group: "modules", kind: "dashboard-module", status: "implemented", description: "Manual gamma levels and local image reference.", files: ["src/components/dashboard/GammaContextModule.tsx"] },
        { id: "fear-greed-module", title: "Fear & Greed", group: "modules", kind: "dashboard-module", status: "implemented", description: "CMC sentiment module and capture candidate publisher.", files: ["src/components/dashboard/FearGreedModule.tsx"] },
        { id: "trading-context-module", title: "Trading Context", group: "modules", kind: "dashboard-module", status: "implemented", description: "Market News, Economic Calendar, Synthesis Notes, Checklist.", files: ["src/components/dashboard/TradingContextModule.tsx"] },
        { id: "supabase-future", title: "Supabase Persistence", group: "future", kind: "planned-migration", status: "future", description: "Planned durable persistence/auth path. Not implemented.", files: ["README.md", "docs/project_constitution.md"] },
        { id: "news-ingestion-future", title: "Market News Ingestion", group: "future", kind: "planned-integration", status: "future", description: "Future watched-source ingestion. Current news is manual.", files: ["src/types/dailySnapshot.ts"] }
      ],
      edges: [
        { id: "edge-shell-provider", from: "dashboard-shell", to: "daily-snapshot-provider", label: "wraps", flow: "app-composition", description: "Modules consume shared daily snapshot state." },
        { id: "edge-provider-storage-save", from: "daily-snapshot-provider", to: "daily-snapshot-storage", label: "save/load", flow: "daily-snapshot", description: "Date-keyed browser persistence." },
        { id: "edge-market-fetch-quotes", from: "market-module", to: "api-market-quotes", label: "fetch", flow: "market-overview", description: "Client hydrates quote read." },
        { id: "edge-fmp-quotes", from: "fmp-source", to: "api-market-quotes", label: "server fetch", flow: "market-overview", description: "Server-only API key boundary." },
        { id: "edge-twelve-quotes", from: "twelve-source", to: "api-market-quotes", label: "server fetch", flow: "market-overview", description: "Server-only API key boundary." },
        { id: "edge-quote-normalizers", from: "api-market-quotes", to: "quote-normalizers", label: "normalize", flow: "market-overview", description: "Provider payloads become MarketQuote rows." },
        { id: "edge-chart-api", from: "candles-chart", to: "api-market-candles", label: "fetch", flow: "market-overview", description: "Index/Futures chart source." },
        { id: "edge-yahoo-candles", from: "yahoo-source", to: "api-market-candles", label: "server fetch", flow: "market-overview", description: "Yahoo chart endpoint." },
        { id: "edge-candle-normalizer", from: "api-market-candles", to: "candle-normalizer", label: "normalize", flow: "market-overview", description: "Typed candle rows." },
        { id: "edge-csv-import", from: "csv-files", to: "performance-module", label: "FileReader", flow: "performance-import", description: "User-selected CSVs." },
        { id: "edge-import-parse", from: "performance-module", to: "import-parsers", label: "parse", flow: "performance-import", description: "Preview and validate imports." },
        { id: "edge-equity-store", from: "performance-module", to: "account-equity-storage", label: "confirm", flow: "performance-import", description: "Save equity records." },
        { id: "edge-ledger-store", from: "performance-module", to: "trade-ledger-storage", label: "confirm", flow: "performance-import", description: "Save closed trades." },
        { id: "edge-performance-calc", from: "account-equity-storage", to: "performance-calculations", label: "derive", flow: "performance-import", description: "Account metrics." },
        { id: "edge-ledger-calc", from: "trade-ledger-storage", to: "performance-calculations", label: "derive", flow: "performance-import", description: "Trade metrics." },
        { id: "edge-fear-api", from: "fear-greed-module", to: "api-fear-greed", label: "fetch", flow: "fear-greed", description: "Client sentiment hydration." },
        { id: "edge-cmc-api", from: "cmc-source", to: "api-fear-greed", label: "server fetch", flow: "fear-greed", description: "Server-only API key." },
        { id: "edge-capture-save", from: "market-snapshot-capture", to: "daily-snapshot-storage", label: "persist", flow: "market-snapshot-capture", description: "Point-in-time market/sentiment save." },
        { id: "edge-synthesis-save", from: "trading-context-module", to: "daily-snapshot-storage", label: "save/cancel", flow: "trading-context", description: "Synthesis/checklist/news daily state." },
        { id: "edge-gamma-save", from: "gamma-module", to: "daily-snapshot-storage", label: "save", flow: "manual-edits", description: "Gamma fields and image in daily snapshot." },
        { id: "edge-auth-proxy-login", from: "auth-proxy", to: "api-login", label: "redirect/login", flow: "auth", description: "Password gate." },
        { id: "edge-supabase-migration", from: "daily-snapshot-storage", to: "supabase-future", label: "future", flow: "future-migration", description: "Durable persistence path." }
      ],
      flows: [
        { id: "market-overview", title: "Market Overview Flow", status: "implemented", summary: "Mock-first quote and candle hydration through server routes.", nodeIds: ["market-module", "api-market-quotes", "fmp-source", "twelve-source", "quote-normalizers", "candles-chart", "api-market-candles", "yahoo-source", "candle-normalizer"], edgeIds: ["edge-market-fetch-quotes", "edge-fmp-quotes", "edge-twelve-quotes", "edge-quote-normalizers", "edge-chart-api", "edge-yahoo-candles", "edge-candle-normalizer"] },
        { id: "performance-import", title: "Performance Review / Import Flow", status: "implemented", summary: "Local CSV imports parse, preview, persist, and derive metrics.", nodeIds: ["csv-files", "performance-module", "import-parsers", "account-equity-storage", "trade-ledger-storage", "performance-calculations"], edgeIds: ["edge-csv-import", "edge-import-parse", "edge-equity-store", "edge-ledger-store", "edge-performance-calc", "edge-ledger-calc"] },
        { id: "trading-context", title: "Trading Context Save / Cancel Flow", status: "implemented", summary: "Draft edits save into or reset from the active daily snapshot.", nodeIds: ["trading-context-module", "daily-snapshot-provider", "daily-snapshot-storage"], edgeIds: ["edge-synthesis-save"] },
        { id: "market-snapshot-capture", title: "Explicit Market Snapshot Capture", status: "implemented", summary: "Hydrated quote/sentiment reads persist only when the capture button is clicked.", nodeIds: ["market-module", "fear-greed-module", "market-snapshot-capture", "daily-snapshot-storage"], edgeIds: ["edge-capture-save"] },
        { id: "manual-edits", title: "Manual Daily Edit Flows", status: "implemented", summary: "Current Position, Gamma, Market News, Synthesis, and Checklist are manual daily state.", nodeIds: ["performance-module", "gamma-module", "trading-context-module", "daily-snapshot-storage"], edgeIds: ["edge-gamma-save", "edge-synthesis-save"] },
        { id: "auth", title: "Authentication Gate", status: "implemented", summary: "Proxy redirects unauthenticated users; login sets signed httpOnly cookie.", nodeIds: ["auth-proxy", "api-login"], edgeIds: ["edge-auth-proxy-login"] },
        { id: "future-migration", title: "Future Supabase Migration Path", status: "future", summary: "Durable persistence and auth are planned but not implemented.", nodeIds: ["daily-snapshot-storage", "account-equity-storage", "trade-ledger-storage", "supabase-future", "news-ingestion-future"], edgeIds: ["edge-supabase-migration"] }
      ],
      localStorageKeys: [
        { key: "market-command:daily-snapshot:${date}", owner: "DailySnapshotProvider", contents: "DailyDashboardSnapshot" },
        { key: "market-command:account-equity-history", owner: "PerformanceModule", contents: "Imported AccountEquitySnapshot[]" },
        { key: "market-command:exchange-trade-ledger", owner: "PerformanceModule", contents: "Imported ExchangeTradeRecord[]" },
        { key: "market-command:fear-greed-cache", owner: "FearGreedModule", contents: "Browser stale sentiment cache" },
        { key: "market-command:market-quotes-cache", owner: "MarketSituationModule", contents: "Browser stale quote cache" }
      ]
    };

    const state = {
      data: embeddedData,
      selectedFlowId: "market-overview",
      selectedNodeId: null,
      selectedEdgeId: null,
      usedFallback: true
    };

    const els = {
      title: document.getElementById("projectTitle"),
      description: document.getElementById("projectDescription"),
      loadNote: document.getElementById("loadNote"),
      nodeCount: document.getElementById("nodeCount"),
      edgeCount: document.getElementById("edgeCount"),
      flowCount: document.getElementById("flowCount"),
      flowTabs: document.getElementById("flowTabs"),
      lanes: document.getElementById("lanes"),
      mapCanvas: document.getElementById("mapCanvas"),
      edgeLayer: document.getElementById("edgeLayer"),
      detailPanel: document.getElementById("detailPanel")
    };

    function byId(items) {
      return new Map((items || []).map((item) => [item.id, item]));
    }

    function shortFile(file) {
      const parts = String(file).split("/");
      return parts.slice(-2).join("/");
    }

    function setSelectedFlow(flowId) {
      state.selectedFlowId = flowId;
      state.selectedNodeId = null;
      state.selectedEdgeId = null;
      renderAll();
    }

    function setSelectedNode(nodeId) {
      state.selectedNodeId = nodeId;
      state.selectedEdgeId = null;
      renderDetail();
      updateHighlights();
    }

    function renderAll() {
      const data = state.data;
      els.title.textContent = "Market Command — Architecture & Operator Flows";
      els.description.textContent = "System map for main data paths, operator actions, local persistence, API boundaries, and planned migration routes.";
      els.loadNote.classList.toggle("is-visible", state.usedFallback);
      els.nodeCount.textContent = String((data.nodes || []).length);
      els.edgeCount.textContent = String((data.edges || []).length);
      els.flowCount.textContent = String((data.flows || []).length);
      renderTabs();
      renderLanes();
      renderDetail();
      requestAnimationFrame(renderEdges);
    }

    function renderTabs() {
      const flows = state.data.flows || [];
      els.flowTabs.innerHTML = "";
      flows.forEach((flow) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `flowButton${flow.id === state.selectedFlowId ? " is-active" : ""}`;
        button.textContent = flow.title;
        button.addEventListener("click", () => setSelectedFlow(flow.id));
        els.flowTabs.appendChild(button);
      });
    }

    function renderLanes() {
      const groups = [...(state.data.groups || [])].sort((a, b) => (a.lane || 0) - (b.lane || 0));
      const nodesByGroup = new Map();
      (state.data.nodes || []).forEach((node) => {
        if (!nodesByGroup.has(node.group)) nodesByGroup.set(node.group, []);
        nodesByGroup.get(node.group).push(node);
      });

      els.lanes.innerHTML = "";
      groups.forEach((group) => {
        const lane = document.createElement("section");
        lane.className = "lane";
        lane.dataset.group = group.id;
        lane.innerHTML = `
          <header class="lane__header">
            <span class="lane__title">${group.title}</span>
            <span class="lane__meta">${group.description || ""}</span>
          </header>
          <div class="lane__body"></div>
        `;
        const body = lane.querySelector(".lane__body");
        (nodesByGroup.get(group.id) || []).forEach((node) => body.appendChild(renderNode(node)));
        els.lanes.appendChild(lane);
      });
      updateHighlights();
    }

    function renderNode(node) {
      const button = document.createElement("button");
      button.type = "button";
      button.id = `node-${node.id}`;
      button.className = "node";
      button.dataset.nodeId = node.id;
      button.dataset.status = node.status || "implemented";
      button.innerHTML = `
        <div class="node__top">
          <span class="node__title">${node.title}</span>
          <span class="node__status">${node.status || "live"}</span>
        </div>
        <span class="node__kind">${node.kind || node.group}</span>
        <p class="node__desc">${node.description || ""}</p>
        <div class="node__files">
          ${(node.files || []).slice(0, 3).map((file) => `<span class="chip">${shortFile(file)}</span>`).join("")}
        </div>
      `;
      button.addEventListener("click", () => setSelectedNode(node.id));
      return button;
    }

    function selectedFlow() {
      return (state.data.flows || []).find((flow) => flow.id === state.selectedFlowId) || (state.data.flows || [])[0] || null;
    }

    function updateHighlights() {
      const flow = selectedFlow();
      const nodeSet = new Set(flow?.nodeIds || []);
      document.querySelectorAll(".node").forEach((nodeEl) => {
        const isInFlow = !flow || nodeSet.has(nodeEl.dataset.nodeId);
        const isSelected = nodeEl.dataset.nodeId === state.selectedNodeId;
        nodeEl.classList.toggle("is-dim", !isInFlow);
        nodeEl.classList.toggle("is-in-flow", isInFlow);
        nodeEl.classList.toggle("is-selected", isSelected);
      });
    }

    function renderEdges() {
      const data = state.data;
      const flow = selectedFlow();
      const highlightedEdges = new Set(flow?.edgeIds || []);
      const canvasRect = els.mapCanvas.getBoundingClientRect();
      const width = Math.max(els.mapCanvas.scrollWidth, canvasRect.width);
      const height = Math.max(els.mapCanvas.scrollHeight, canvasRect.height);
      els.edgeLayer.setAttribute("viewBox", `0 0 ${width} ${height}`);
      els.edgeLayer.setAttribute("width", width);
      els.edgeLayer.setAttribute("height", height);
      els.edgeLayer.innerHTML = `
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L8,4 L0,8 Z" fill="rgba(116, 224, 174, 0.66)"></path>
          </marker>
        </defs>
      `;

      (data.edges || []).forEach((edge) => {
        const from = document.getElementById(`node-${edge.from}`);
        const to = document.getElementById(`node-${edge.to}`);
        if (!from || !to) return;

        const a = from.getBoundingClientRect();
        const b = to.getBoundingClientRect();
        const x1 = a.left - canvasRect.left + a.width;
        const y1 = a.top - canvasRect.top + a.height / 2;
        const x2 = b.left - canvasRect.left;
        const y2 = b.top - canvasRect.top + b.height / 2;
        const dx = Math.max(42, Math.abs(x2 - x1) * 0.38);
        const path = `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
        const isHighlight = highlightedEdges.has(edge.id);
        const pathEl = document.createElementNS("http://www.w3.org/2000/svg", "path");
        pathEl.setAttribute("d", path);
        pathEl.setAttribute("class", `edgePath${isHighlight ? " is-highlight" : " is-dim"}`);
        pathEl.setAttribute("marker-end", "url(#arrow)");
        els.edgeLayer.appendChild(pathEl);

        if (isHighlight) {
          const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
          text.setAttribute("x", String((x1 + x2) / 2));
          text.setAttribute("y", String((y1 + y2) / 2 - 6));
          text.setAttribute("class", "edgeLabel");
          text.textContent = edge.label || "";
          els.edgeLayer.appendChild(text);
        }
      });
    }

    function renderDetail() {
      const data = state.data;
      const nodeMap = byId(data.nodes);
      const edgeMap = byId(data.edges);
      const flow = selectedFlow();
      const selectedNode = state.selectedNodeId ? nodeMap.get(state.selectedNodeId) : null;
      const subject = selectedNode || flow;

      if (!subject) {
        els.detailPanel.innerHTML = "";
        return;
      }

      const files = selectedNode ? selectedNode.files || [] : [];
      const storage = selectedNode ? selectedNode.storage || [] : [];
      const relatedEdges = selectedNode
        ? (data.edges || []).filter((edge) => edge.from === selectedNode.id || edge.to === selectedNode.id)
        : (flow.edgeIds || []).map((id) => edgeMap.get(id)).filter(Boolean);
      const steps = selectedNode ? [] : flow.steps || [];

      els.detailPanel.innerHTML = `
        <div>
          <span class="eyebrow">${selectedNode ? selectedNode.kind || "node" : "selected flow"}</span>
          <h2>${subject.title}</h2>
        </div>
        <p>${subject.description || subject.summary || ""}</p>

        <div class="detailBlock">
          <span class="detailLabel">Legend</span>
          <div class="legend">
            <span class="legendItem"><i class="dot"></i>Implemented</span>
            <span class="legendItem"><i class="dot manual"></i>Manual</span>
            <span class="legendItem"><i class="dot cache"></i>Cache</span>
            <span class="legendItem"><i class="dot future"></i>Future</span>
          </div>
        </div>

        ${steps.length ? `
          <div class="detailBlock">
            <span class="detailLabel">Flow Steps</span>
            <ul class="detailList">${steps.map((step) => `<li>${step}</li>`).join("")}</ul>
          </div>
        ` : ""}

        ${relatedEdges.length ? `
          <div class="detailBlock">
            <span class="detailLabel">${selectedNode ? "Connected Edges" : "Highlighted Edges"}</span>
            <ul class="detailList">${relatedEdges.slice(0, 12).map((edge) => `<li>${edge.from} -> ${edge.to}: ${edge.label || ""}</li>`).join("")}</ul>
          </div>
        ` : ""}

        ${files.length ? `
          <div class="detailBlock">
            <span class="detailLabel">File References</span>
            <ul class="detailList">${files.map((file) => `<li>${file}</li>`).join("")}</ul>
          </div>
        ` : ""}

        ${storage.length ? `
          <div class="detailBlock">
            <span class="detailLabel">Storage Keys</span>
            <ul class="detailList">${storage.map((key) => `<li>${key}</li>`).join("")}</ul>
          </div>
        ` : ""}

        <div class="detailBlock">
          <span class="detailLabel">Persistence Layer</span>
          <div class="storageGrid">
            ${(data.localStorageKeys || []).map((row) => `
              <div class="storageRow">
                <strong>${row.key}</strong>
                <span>${row.owner}: ${row.contents}</span>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    async function loadData() {
      try {
        const response = await fetch("./architecture-flow.json", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const json = await response.json();
        state.data = json;
        state.usedFallback = false;
        state.selectedFlowId = (json.flows || []).some((flow) => flow.id === "market-overview")
          ? "market-overview"
          : (json.flows || [])[0]?.id || null;
      } catch {
        state.usedFallback = true;
      }
      renderAll();
    }

    window.addEventListener("resize", () => requestAnimationFrame(renderEdges));
    document.querySelector(".mapPanel").addEventListener("scroll", () => requestAnimationFrame(renderEdges), { passive: true });
    loadData();
  </script>
</body>
</html>
